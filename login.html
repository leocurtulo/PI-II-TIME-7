<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tela de Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login">
    <h2>Faça seu login</h2>
    <form id="formLogin">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario">
      <span id="erroUsuario" class="mensagem-erro"></span>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha">
      <div class="requisitos-senha">

      <p id="req8" class="invalido"> Pelo menos 8 caracteres</p> 
      <p id="reqMaiuscula" class="invalido"> Pelo menos 1 letra maiúscula</p> 
      <p id="reqMinuscula" class="invalido"> Pelo menos 1 letra minúscula</p> 
      <p id="reqNumero" class="invalido"> Pelo menos 1 número</p> 
      <p id="reqEspecial" class="invalido"> Pelo menos 1 caractere especial</p> 

      </div> 
      <span id="erroSenha" class="mensagem-erro"></span>

      <button type="submit">Entrar</button>
    </form>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
