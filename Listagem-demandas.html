<!DOCTYPE html>
<!--
AUTOR: Caio Ferreira Aragão
DESCRIÇÃO: Tela de listagem de demandas. Os dados vêm da API (GET /demandas),
com busca, filtros, ordenação e acesso aos detalhes de cada demanda.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Demandas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Organização dos filtros nesta tela, sem alterar o CSS compartilhado. */
        .filtros-linha {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filtros-linha .campo {
            flex: 1;
            min-width: 140px;
        }

        .aviso-lista {
            padding: 20px;
            color: #555555;
        }
    </style>
</head>
<body>

    <header class="cabecalho">
        <h2>Sistema de Acompanhamento de Demandas</h2>
        <nav class="menu">
            <a href="dashboard-demanda.html">Dashboard</a>
            <a href="Listagem-demandas.html">Demandas</a>
            <a href="cadastro-demanda.html">Nova Demanda</a>
            <a href="#" id="linkSair">Sair</a>
        </nav>
    </header>

    <main class="container">
        <div id="inicio">
            <h1 class="titulo">Demandas</h1>
        </div>

        <div class="painel">
            <h2>Buscar e Filtrar</h2>

            <div class="campo">
                <label for="buscaTexto">Buscar (Título ou Descrição):</label>
                <input type="text" id="buscaTexto" maxlength="100" placeholder="Digite o que procura...">
                <span id="erroBusca" class="mensagem-erro"></span>
            </div>

            <div class="filtros-linha">
                <div class="campo">
                    <label for="filtroStatus">Status:</label>
                    <select id="filtroStatus">
                        <option value="todos">Todos</option>
                        <option value="Aberta">Aberta</option>
                        <option value="Em andamento">Em andamento</option>
                        <option value="Em revisão">Em revisão</option>
                        <option value="Concluída">Concluída</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="filtroPrioridade">Prioridade:</label>
                    <select id="filtroPrioridade">
                        <option value="todos">Todas</option>
                        <option value="Crítica">Crítica</option>
                        <option value="Alta">Alta</option>
                        <option value="Média">Média</option>
                        <option value="Baixa">Baixa</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="filtroTipo">Tipo:</label>
                    <select id="filtroTipo">
                        <option value="todos">Todos</option>
                        <option value="Tarefa">Tarefa</option>
                        <option value="Defeito">Defeito</option>
                        <option value="Melhoria">Melhoria</option>
                        <option value="Documentação">Documentação</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="filtroResponsavel">Responsável:</label>
                    <select id="filtroResponsavel">
                        <option value="todos">Todos</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="filtroProjeto">Projeto:</label>
                    <select id="filtroProjeto">
                        <option value="todos">Todos</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="ordenacao">Ordenar por:</label>
                    <select id="ordenacao">
                        <option value="prazo">Prazo (mais próximo)</option>
                        <option value="criacao">Data de criação</option>
                        <option value="prioridade">Prioridade</option>
                        <option value="status">Status (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Mensagem da API (400, 401, 404 ou falha de conexão), visível na tela. -->
        <p id="mensagemErro" class="mensagem-erro"></p>

        <!-- Preenchida pelo JavaScript com o retorno de GET /demandas. -->
        <div id="lista">
            <p class="aviso-lista">Carregando demandas...</p>
        </div>
    </main>

    <script src="js/filtros-busca-listagem-demanda.js"></script>
</body>
</html>
