<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Demandas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <h2>Sistema de Acompanhamento de Demandas</h2>
    </header>

    <main class="container">

        <div id="inicio">
            <h1>Demandas</h1>
        </div>

        <div id="lista" style="display: none;">
            <h1>Lista de Demandas</h1>

            <div class="exemplo">
                <h3>Atualização do sistema</h3>
                <p><strong>Responsável:</strong> João Silva</p>
                <p><strong>Prazo:</strong> 20/09/2026</p>
                <p><strong>Status:</strong> Em andamento</p>
            </div>

            <div class="exemplo">
                <h3>Correção de cadastro de usuários</h3>
                <p><strong>Responsável:</strong> Maria Santos</p>
                <p><strong>Prazo:</strong> 25/09/2026</p>
                <p><strong>Status:</strong> Pendente</p>
            </div>

        </div>

    </main>

</body>
</html>
