<!DOCTYPE html>
<!-- Autor: Augusto Brufato Pereira dos Santos
     Descrição: Detalhes das demandas-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Demanda</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">
        <h2>Sistema de Acompanhamento de Demandas</h2>

        <!-- Menu igual em todas as telas; o nome do usuário e o botão Sair são preenchidos pelo sessao.js -->
        <nav class="menu">
            <a href="dashboard-demanda.html">Dashboard</a>
            <a href="Listagem-demandas.html">Demandas</a>
            <a href="cadastro-demanda.html">Nova Demanda</a>
            <span id="usuarioLogado"></span>
            <button id="botaoSair" type="button">Sair</button>
        </nav>
    </header>

    <main>

        <h1 class="titulo">Detalhes da Demanda</h1>

        <!-- Os campos vêm vazios e são preenchidos pelo detalhes-demanda.js com os dados da API -->
        <section class="formulario">

            <h2>Informações da Demanda</h2>

            <div class="campo">
                <label>ID:</label>
                <p id="demandaId"></p>
            </div>

            <div class="campo">
                <label>Título:</label>
                <p id="tituloDemanda"></p>
            </div>

            <div class="campo">
                <label>Tipo:</label>
                <p id="tipoDemanda"></p>
            </div>

            <div class="campo">
                <label>Prioridade:</label>
                <p id="prioridadeDemanda"></p>
            </div>

            <div class="campo">
                <label>Status:</label>
                <p id="statusDemanda"></p>
            </div>

            <div class="campo">
                <label>Projeto:</label>
                <p id="projetoDemanda"></p>
            </div>

            <div class="campo">
                <label>Responsável:</label>
                <p id="responsavelDemanda"></p>
            </div>

            <div class="campo">
                <label>Data de Criação:</label>
                <p id="dataCriacaoDemanda"></p>
            </div>

            <div class="campo">
                <label>Última Atualização:</label>
                <p id="dataAtualizacaoDemanda"></p>
            </div>

            <div class="campo">
                <label>Prazo de Finalização:</label>
                <p id="prazoDemanda"></p>
            </div>

        </section>

        
        <section class="formulario">

            <h2>Descrição</h2>

            <div class="campo">
                <p id="descricaoDemanda"></p>
            </div>

        </section>
        <section class="formulario">

    <h2>Pesquisar na Demanda</h2>

    <div class="campo">
        <input
            type="text"
            id="campoBusca"
            placeholder="Pesquisar palavras-chave">
    </div>

    <p  id="erroBusca"></p>

    <button id="btnBusca" type="button">
        Buscar
    </button>

</section>

<!-- Comentários e histórico são carregados da API e montados pelo detalhes-demanda.js -->
        <section class="formulario">

    <h2>Comentários</h2>

    <div id="listaComentarios">

</div>

    <div class="campo">

        <label for="comentario">
            Novo Comentário:
        </label>

        <textarea
            id="comentario"
            rows="5"
            placeholder="Digite seu comentário">
        </textarea>

        <p id="erro-comentario"></p>

        <button
            id="btnComentario"
            type="button">
            Enviar Comentário
        </button>

    </div>

</section>

        <section class="formulario">

            <h2>Histórico de Alterações</h2>

            <ul id="listaHistorico">
               
            </ul>

        </section>
        <!-- O backend confere se a mudança de status segue o ciclo de vida e o perfil do usuário -->
        <section class="formulario">

            <h2>Alterar Status</h2>

            <div class="campo">
                <label for="novoStatus">Novo status:</label>
                <select id="novoStatus">
                    <option value="">Selecione</option>
                    <option value="Aberta">Aberta</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Em revisão">Em revisão</option>
                    <option value="Concluída">Concluída</option>
                </select>
            </div>

            <button id="btnAlterarstatus" type="button">
                Salvar status
            </button>

        </section>

        <!-- Editar e Cancelar ficam escondidos para o Membro da Equipe -->
        <section class="formulario">

            <button id="btnEditar">
                Editar
            </button>
            <button id="btnCancelar">
                Cancelar demanda
            </button>
            <a href="Listagem-demandas.html">
                <button>
                    Voltar
                </button>
            </a>

        </section>

    </main>

    <script src="js/api.js"></script>  
    <script src="js/sessao.js"></script>
<script src="js/detalhes-demanda.js"></script>   

    
    
</body>
    
    </html>
